<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Particles Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
            background: #000;
        }

        #info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 14px;
            z-index: 10;
        }

        #info p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="info">
        <p>Hearts: <span id="heartCount">0</span></p>
        <p>Click to create hearts</p>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const ww = canvas.width = window.innerWidth;
        const wh = canvas.height = window.innerHeight;

        let hearts = [];
        const textHearts = [];
        const heartOutlineText = [];

        // Heart particle constructor
        function Heart(x, y) {
            this.x = x || Math.random() * ww;
            this.y = y || Math.random() * wh;
            this.opacity = Math.random() * 0.5 + 0.5;
            this.vel = {
                x: (Math.random() - 0.5) * 4,
                y: (Math.random() - 0.5) * 4,
            };
            this.targetScale = Math.random() * 0.15 + 0.02;
            this.scale = this.targetScale * Math.random();
            this.life = 1;
            this.decay = Math.random() * 0.015 + 0.015;
        }

        // Heart drawing function
        Heart.prototype.draw = function() {
            ctx.save();
            ctx.globalAlpha = this.opacity * this.life;
            ctx.fillStyle = '#ff69b4';
            ctx.translate(this.x, this.y);
            ctx.scale(this.scale, this.scale);
            ctx.beginPath();
            
            // Draw heart shape using bezier curves
            ctx.moveTo(75, 40);
            ctx.bezierCurveTo(75, 37, 70, 25, 50, 25);
            ctx.bezierCurveTo(37, 25, 25, 37, 25, 50);
            ctx.bezierCurveTo(25, 68, 75, 100, 75, 100);
            ctx.bezierCurveTo(75, 100, 125, 68, 125, 50);
            ctx.bezierCurveTo(125, 37, 113, 25, 100, 25);
            ctx.bezierCurveTo(80, 25, 75, 37, 75, 40);
            
            ctx.fill();
            ctx.restore();
        };

        // Heart update function
        Heart.prototype.update = function() {
            this.x += this.vel.x;
            this.y += this.vel.y;
            this.vel.y += 0.1; // Gravity
            this.life -= this.decay;
            this.scale += this.targetScale * 0.02;
            this.opacity *= 0.98;
        };

        // Create text horizontally in center
        function createTextHeart() {
            const words = ["te", "amo"];
            const centerX = ww / 2;
            const centerY = wh / 2;
            const spacing = 120; // Espacio entre palabras
            
            let xPos = centerX - (spacing / 2);
            
            for (let word of words) {
                const charSpacing = 50; // Espacio entre letras
                let charXPos = xPos - ((word.length - 1) * charSpacing) / 2;
                
                for (let i = 0; i < word.length; i++) {
                    textHearts.push({
                        x: charXPos + i * charSpacing,
                        y: centerY,
                        char: word[i],
                        angle: 0
                    });
                }
                xPos += spacing;
            }
        }

        // Create heart outline with "te amo" text
        function createHeartOutline() {
            const text = "te amote amote amote amote amo"; // Repetimos para llenar todo el corazón
            const heartScale = 5;
            const centerX = ww / 2;
            const centerY = wh / 2 - 100;
            
            // Generate points along heart curve
            const points = [];
            for (let t = 0; t < Math.PI * 2; t += 0.02) {
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                points.push({
                    x: centerX + x * heartScale,
                    y: centerY - y * heartScale
                });
            }
            
            // Place text characters along heart curve horizontally
            for (let i = 0; i < points.length; i++) {
                const point = points[i];
                const charIndex = i % text.length;
                heartOutlineText.push({
                    x: point.x,
                    y: point.y,
                    char: text[charIndex],
                    angle: 0 // Mantener horizontal
                });
            }
        }

        // Draw text heart horizontally in center
        function drawTextHeart() {
            ctx.save();
            ctx.font = "bold 80px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = "#ff1493";
            
            textHearts.forEach((textHeart) => {
                ctx.fillStyle = "#ff1493";
                ctx.fillText(textHeart.char, textHeart.x, textHeart.y);
            });
            
            ctx.restore();
        }

        // Draw heart outline
        function drawHeartOutline() {
            ctx.save();
            ctx.font = "bold 14px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = "#ff69b4";
            
            heartOutlineText.forEach((textHeart) => {
                ctx.fillStyle = "#ff69b4";
                ctx.fillText(textHeart.char, textHeart.x, textHeart.y);
            });
            
            ctx.restore();
        }

        // Animation loop
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, ww, wh);

            for (let i = hearts.length - 1; i >= 0; i--) {
                const heart = hearts[i];
                heart.update();
                heart.draw();

                if (heart.life <= 0) {
                    hearts.splice(i, 1);
                }
            }

            // Draw the heart outline
            drawHeartOutline();

            // Draw the text heart in center
            drawTextHeart();

            document.getElementById('heartCount').textContent = hearts.length;
            requestAnimationFrame(animate);
        }

        // Create hearts on click
        document.addEventListener('click', (e) => {
            for (let i = 0; i < 5; i++) {
                hearts.push(new Heart(e.clientX, e.clientY));
            }
        });

        // Auto-create hearts
        setInterval(() => {
            const randomX = Math.random() * ww;
            const randomY = Math.random() * wh;
            hearts.push(new Heart(randomX, randomY));
        }, 300);

        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = ww;
            canvas.height = wh;
            textHearts.length = 0;
            heartOutlineText.length = 0;
            createTextHeart();
            createHeartOutline();
        });

        // Initialize
        createTextHeart();
        createHeartOutline();
        animate();
    </script>
</body>
</html>
